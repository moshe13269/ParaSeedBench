[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paraseedbench"
version = "0.3.0"
description = "Crossed prompt-wording and random-seed reliability benchmark for text-to-image models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Moshe Laufer"},
  {name = "Oren Barkan"},
  {name = "Noam Koenigstein"},
]
keywords = ["text-to-image", "robustness", "prompt paraphrase", "random seed", "evaluation"]
dependencies = [
  "accelerate>=1.0,<2",
  "diffusers>=0.35,<0.39",
  "transformers>=4.55,<5",
  "safetensors>=0.4",
  "sentencepiece>=0.2,<1",
  "protobuf>=5,<7",
  "invisible-watermark>=0.2,<1",
  "huggingface-hub>=0.25",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
paraseedbench = "paraseedbench.run_v2:main"
paraseedbench-freeze = "paraseedbench.freeze_v2:main"
paraseedbench-audit = "paraseedbench.audit_v2:main"
paraseedbench-reanalyze = "paraseedbench.reanalyze_v2:main"
paraseedbench-verify-release = "paraseedbench.verify_release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
